workflows:
  foto-foto-ios-simulator:
    name: FOTO FOTO iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Show Xcode project targets
        script: |
          xcodebuild -list -project "ios/FOTO FOTO.xcodeproj"
      - name: Build iOS app for simulator
        script: |
          xcodebuild \
            -project "ios/FOTO FOTO.xcodeproj" \
            -target "FOTO FOTO" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
